<title>سَكَن</title><link rel="manifest" href="manifest-v6.webmanifest"><link rel="apple-touch-icon" href="v4-apple-touch-180.png"><meta name="theme-color" content="#f8b8cf">
<style>
:root{--pk:#f8b8cf;--pk2:#fde3ec;--gr:#2e5a3a;--gr2:#dcebdc;--yl:#fdf0c8;--tx:#4a2f3b;--mut:#9a7686}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;background:#fdf1f5;color:var(--tx);padding-bottom:84px}
.th{background:var(--pk);padding:18px 16px 14px;border-radius:0 0 28px 28px;box-shadow:0 4px 14px #e8739f33;position:sticky;top:0;z-index:5}
.th h1{margin:0;font-size:22px;color:var(--gr)}.th small{color:#6b3f51}.tu{float:left;width:96px;height:36px;object-fit:contain;margin-top:-2px}.ic{width:1em;height:1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sec .ic{width:34px;height:34px;display:block;margin:0 auto 6px}.tabs .ic{width:26px;height:26px;display:block;margin:0 auto 2px}.mood svg{width:44px;height:44px}
main{padding:12px}
.card{background:#fff;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 5px 0 #f1cfdb,0 8px 16px #e8739f22}
.card h3{margin:0 0 8px;font-size:17px;color:var(--gr)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{border:0;border-radius:22px;padding:16px 10px;font:inherit;font-size:16px;font-weight:700;color:var(--gr);text-align:center;box-shadow:0 5px 0 #0001;cursor:pointer}

.c1{background:var(--gr2)}.c2{background:var(--pk2)}.c3{background:var(--yl)}.c4{background:#ece4f7}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed #f1d3de}.row:last-child{border:0}
.row label{flex:1}.crow{flex-wrap:wrap}.crow label{flex:1 1 100%}.crow input[type=checkbox]{order:2}.row input[type=checkbox]{width:26px;height:26px;accent-color:#e8739f}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:2px solid var(--pk);background:#fff;border-radius:20px;padding:8px 14px;font:inherit;color:var(--gr);cursor:pointer}.chip.on{background:#e8739f;color:#fff;border-color:#e8739f}
input,textarea,select{font:inherit;width:100%;padding:11px;border-radius:14px;border:2px solid #f1cfdb;background:#fff;color:var(--tx);margin:4px 0}
.btn{display:block;width:100%;border:0;border-radius:22px;background:#e8739f;color:#fff;font:inherit;font-weight:700;font-size:16px;padding:13px;margin:8px 0;box-shadow:0 4px 0 #c4577f;cursor:pointer}
.btn.alt{background:var(--gr);box-shadow:0 4px 0 #1d3a25}.btn.red{background:#b3414f;box-shadow:0 4px 0 #7f2a34}
.mood{display:flex;justify-content:space-between}.mood b{opacity:.55;cursor:pointer;line-height:0}.mood b.on{opacity:1;transform:scale(1.15)}.mood b.on circle.f{fill:#f8b8cf}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #f1cfdb;padding-bottom:env(safe-area-inset-bottom);z-index:9}
.tabs a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mut);text-decoration:none}.tabs a.on{color:var(--gr);font-weight:700}
.note{font-size:12px;color:var(--mut);margin:6px 2px}.ph{background:#fff8e1;border:2px dashed #e6c86e;border-radius:16px;padding:12px;font-size:14px}
.brand{text-align:center;font-family:"Noto Serif",Georgia,serif;color:#8a6577;margin:18px 0 6px}
.cell{display:inline-block;width:14.2%;text-align:center;padding:8px 0;border-radius:10px;font-size:13px}
.bk{display:inline-block;width:46%;margin:2%;background:#fff;border-radius:16px;padding:10px;text-align:center;vertical-align:top;box-shadow:0 3px 0 #f1cfdb}
.bk i{display:flex;align-items:center;justify-content:center;height:110px;border-radius:6px 12px 12px 6px;margin-bottom:6px;font-style:normal;color:#fff;border-inline-start:8px solid #0002}.bk i svg{width:46px;height:46px}.bk b{color:var(--tx)}.bk small{color:var(--mut)}
.pick{display:flex;align-items:center;justify-content:space-between;width:100%;border:2px solid var(--pk);background:#fff;border-radius:18px;padding:12px;font:inherit;color:var(--tx);cursor:pointer;margin-top:4px}.pick span{color:var(--gr);font-weight:700}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:#4a2f3b99;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.ov .box{background:#fff;border-radius:24px;padding:16px;width:100%;max-width:380px;max-height:80vh;overflow:auto}.ov h3{margin:0 0 8px;color:var(--gr)}.ov .row label{font-size:16px}.ov input[type=radio]{width:24px;height:24px;accent-color:#e8739f}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.pill{border:0;border-radius:20px;padding:8px 14px;font:inherit;background:var(--pk2);color:var(--gr);cursor:pointer}.pill.on{background:#e8739f;color:#fff}
.q{background:var(--pk2)}.q.g2{background:var(--gr2)}.q p{margin:0 0 6px;color:var(--tx);font-size:16px}.q small{color:#6b3f51}
.bar{height:12px;border-radius:8px;background:#fff;border:2px solid var(--pk);overflow:hidden}.bar i{display:block;height:100%;background:#e8739f}
.chk{width:70px;height:70px;display:block;margin:0 auto}
#cel{text-align:center}

const TS_N=7,TS_SP=56;

const tsView=()=>{const c=g('tsb',0);return `<div class="card"><h3>${I('quran')} السبحة</h3><p class="note">دوسي على الخرزة وكل ضغطة بتعدّ واحد. العدّاد بيتحفظ على جهازك.</p><div id="tsw" onclick="tsTap()" role="button" aria-label="سبحة" style="position:relative;height:88px;overflow:hidden;margin:10px 0;cursor:pointer;direction:ltr"><div style="position:absolute;left:0;right:0;top:43px;height:3px;background:var(--gr);opacity:.6"></div><div id="tss" style="position:absolute;top:0;left:50%;margin-left:-${TS_N*TS_SP+22}px;width:${TS_N*3*TS_SP}px;height:88px;transform:translateX(${(c%TS_N)*TS_SP}px)">${tsBeads()}</div><div style="position:absolute;left:50%;top:6px;margin-left:-6px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #e6b422"></div></div><div id="tsc" style="text-align:center;font-size:56px;font-weight:700;color:var(--tx)">${c}</div><div style="text-align:center"><button class="btn" style="max-width:200px" onclick="tsReset()">إعادة من الصفر</button></div></div>`};

H.adhkar=()=>{shell('المصحف والأذكار');const W={morning:'الصبح',evening:'المسا'};const adkList=(set,mode)=>{if(!ADK)return[];const arr=set==='sleep'?ADK.sleep:ADK.morning_evening,tab=set==='sleep'?null:set;const L=[];arr.forEach(en=>en.variants.filter(v=>!tab||!v.when||v.when===tab).forEach(v=>v.items.forEach(d=>{if(mode==='full'||d.arabic.length<=120)L.push(d)})));return L};

return `<div class="card"><h3>${I('quran')} المصحف</h3><div class="ph"><a href="#quran">نص المصحف كامل</a> (١١٤ سورة، نص بس من غير صور الصفحات)</div></div><div class="pills"><button class="pill ${w==='morning'?'on':''}" onclick="st('adw','morning');window._as=null;window._ai=0;render()">أذكار الصباح</button><button class="pill ${w==='evening'?'on':''}" onclick="st('adw','evening');window._as=null;window._ai=0;render()">أذكار المساء</button></div>`+(()=>{const set=window._as||w,mode=g('adm','short'),L=adkList(set,mode),i=Math.min(window._ai||0,Math.max(L.length-1,0)),d=L[i];const tabs=`${set==='sleep'?sleepCard():''}<div class="pills"><button class="pill ${set!=='sleep'?'on':''}" onclick="window._as=null;window._ai=0;render()">${w==='morning'?'الصباح':'المساء'}</button><button class="pill ${set==='sleep'?'on':''}" onclick="window._as='sleep';window._ai=0;render()">النوم</button></div><div class="pills"><button class="pill ${mode==='short'?'on':''}" onclick="st('adm','short');window._ai=0;render()">مختصرة (عدد أقل)</button><button class="pill ${mode==='full'?'on':''}" onclick="st('adm','full');window._ai=0;render()">كاملة</button></div>`;if(!ADK)return tabs+'<div class="card"><div class="ph">بيتحمّل...</div></div>';if(!d)return tabs;const last=i>=L.length-1;return tabs+`<div class="card"><p class="note">${i+1} من ${L.length}</p>${ORNW(`<p style="color:var(--tx);font-size:20px;line-height:2.2;text-align:center;margin:0">${e(d.arabic)}${d.times?` <b>(${d.times} مرات)</b>`:''}</p>`)}${dcHtml(dcKey(set,mode,i),Math.max(1,+d.times||1))}<div class="row" style="gap:8px">${i>0?`<button class="btn" onclick="window._ai=${i-1};render()">السابق</button>`:''}<button class="btn" onclick="window._ai=${last?0:i+1};render()">${last?'خلصت، من الأول':'التالي'}</button></div><p class="note">«مختصرة» معناها أذكار أقصر وعددها أقل، والنص نفسه بيظهر كامل من غير تقطيع.</p></div>`})()+(ADK?`<p class="note">النص من «حصن المسلم» للشيخ سعيد بن علي بن وهف القحطاني، عن مجموعة OpenDua (الإصدار 0.0.4)، رخصة CC BY 4.0، opendua.org. النص العربي من غير تعديل. عدد التكرار بيظهر لما المصدر يحدده، والتعليمات الإضافية لسه ما اتضافتش.</p>`:'')+`<div class="card"><h3>${I('bell')} وقت نومي</h3><input type="time" value="${g('sleep','22:30')}" onchange="st('sleep',this.value)"><p class="note">التذكير بأذكار النوم وسورة الملك لسه ما اتبنيش، ومحتاج اختبار على الموبايل.</p></div>`};

H.day=()=>{shell('يومياتي','النهارده');return `<div class="card"><h3>مزاجي</h3><div class="mood">${MOODS(g('mood'+today(),-1))}</div></div>`+[0].map(i=>`<div class="card"><h3>${I('day')} مهامي</h3><div id="tk${i}">${[0,1,2].map(i=>(g('tasks'+i+today(),[])).map((x,j)=>`<div class="row"><label>${e(x.t)}${x.dl?`<br><small class="dl" style="color:${!x.d&&x.dl<nowL()?'#b3414f':'var(--mut)'}">الميعاد: ${e(x.dl.replace('T',' '))}${!x.d&&x.dl<nowL()?' (فات)':''}</small>`:''}${x.rm?`<br><small class="rm" style="color:var(--mut)">تذكير مخطط: ${e(x.rm.replace('T',' '))} ${rmLabel(x)}</small>`:''}</label><input type="checkbox" ${x.d?'checked':''} onchange="tk(${i},${j},this.checked)">${x.rm?`<button class="chip" onclick="trm(${i},${j})">شيلي التذكير</button>`:''}<button class="chip" aria-label="مسح" onclick="tdel(${i},${j})">×</button></div>`).join('')).join('')}</div><input id="nt${i}" placeholder="مهمة جديدة"><label class="note">ميعاد التسليم (اختياري، فاضي لو مش عايزة)</label><input id="nd${i}" type="datetime-local"><label class="note">تذكير على الموبايل (اختياري، لسه تحت التجربة)</label><input id="nr${i}" type="datetime-local"><button class="btn" onclick="at(${i})">إضافة</button></div>`).join('')+`<div class="card"><h3>استيراد من التقويم (ملف .ics)</h3><p class="note">اختاري ملف تقويم من جوجل أو أبل أو أي تطبيق. بيتقرا على جهازك بس ومش بيترفع في أي مكان. لسه تحت التجربة.</p><input type="file" id="icsf" accept=".ics,text/calendar" onchange="icsRead(this)"><div id="icsp"></div></div>`+`<div class="card"><h3>${I('flower')} الشكر ونعمة اليوم</h3><p class="note">اكتبي نعمة من ربنا النهارده، ولو في أكتر من نعمة ضيفيهم واحدة واحدة.</p>${g('bless'+today(),[]).map((x,j)=>`<div class="row"><label>${e(x)}</label><button class="chip" aria-label="مسح النعمة" onclick="bdel(${j})">×</button></div>`).join('')}<input id="bl" placeholder="نعمة اليوم"><button class="btn" onclick="badd()">إضافة نعمة</button><label class="note">امتنان اليوم (كلام حر)</label><textarea rows=2 onchange="st('grat${today()}',this.value)">${e(g('grat'+today(),''))}</textarea></div><div class="card"><h3>جملة آخر اليوم (اختياري)</h3><input value="${e(g('end'+today(),''))}" onchange="st('end${today()}',this.value)"></div><p class="note">المهام مش بتترحّل لوحدها لليوم التاني.</p>`};

window.icsZone=(y,mo,d,h,mi,tz)=>{try{const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});const off=t=>{const p={};f.formatToParts(new Date(t)).forEach(x=>p[x.type]=+x.value);return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-t};const w=Date.UTC(y,mo,d,h,mi);let u=w-off(w);u=w-off(u);return new Date(u)}catch(e){return null}};
window.icsParse=t=>{const L=t.replace(/\r?\n[ \t]/g,'').split(/\r?\n/),out=[];let c=null;for(const l of L){if(l==='BEGIN:VEVENT')c={};else if(l==='END:VEVENT'){if(c&&c.s&&c.d)out.push(c);c=null}else if(c){const i=l.indexOf(':');if(i<0)continue;const k=l.slice(0,i).split(';')[0],v=l.slice(i+1);if(k==='SUMMARY')c.s=v.replace(/\\([,;nN\\])/g,(m,x)=>x==='n'||x==='N'?' ':x).trim();if(k==='RRULE')c.rec=1;if(k==='DTSTART'){const tm=l.slice(0,i).match(/TZID=([^;:]+)/);if(tm)c.tz=tm[1].replace(/"/g,'');const m=v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/);if(m){let d;if(m[7])d=new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5]));else if(c.tz&&m[4]){d=icsZone(+m[1],+m[2]-1,+m[3],+m[4],+m[5],c.tz);if(!d)c.bad='المنطقة الزمنية «'+c.tz+'» مش مدعومة، مش هضيف الحدث بساعة غلط'}else d=new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));c.d=d||new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));c.ad=!m[4]}}}}return out.sort((a,b)=>a.d-b.d)};
window.icsRead=inp=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const ev=icsParse(String(r.result)).slice(0,100);window._ics=ev;const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());$('#icsp').innerHTML=ev.length?ev.map((x,i)=>{const t=ds(x.d)+(x.ad?' (طول اليوم، من غير ساعة)':' '+pad(x.d.getHours())+':'+pad(x.d.getMinutes()));if(x.bad)return `<div class="row"><label>${e(x.s)}<br><small>${t} · ${e(x.bad)}</small></label></div>`;if(x.rec)return `<div class="row"><label><input type="checkbox" class="icsc" data-i="${i}"> ${e(x.s)}<br><small>${t} · حدث متكرر. مش هيتضاف إلا لو علّمتي هنا إنك عايزاه مرة واحدة بس</small></label></div>`;return `<div class="row"><label><input type="checkbox" class="icsc" checked data-i="${i}"> ${e(x.s)}<br><small>${t}${x.tz?' · الساعة اتحوّلت لتوقيت جهازك من '+e(x.tz):''}</small></label></div>`}).join('')+`<button class="btn" onclick="icsAdd()">أضيف المختار كمهام</button>`:'<p class="note">مفيش أحداث اتلاقت في الملف.</p>'};r.readAsText(f)};
window.icsAdd=()=>{const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());let n=0;document.querySelectorAll('.icsc:checked').forEach(c=>{const x=window._ics[+c.dataset.i],h=x.ad?9:x.d.getHours(),i=h<12?0:h<17?1:2,k='tasks'+i+ds(x.d),a=g(k,[]);if(a.some(t=>t.t===x.s))return;const o={t:x.s,d:false};if(!x.ad)o.dl=ds(x.d)+'T'+pad(x.d.getHours())+':'+pad(x.d.getMinutes());a.push(o);st(k,a);n++});render();$('#icsp').innerHTML=`<p class="note">اتضاف ${n} مهمة. المهام بتظهر في يومها.</p>`};

const HWD=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

const hwGet=()=>{let h=g('hw',null);if(!h){h={days:HWDEF.map((a,d)=>a.map((t,i)=>({id:'d'+d+'_'+i,t}))),rest:[0,0,0,0,0,0,1]};st('hw',h)}return h};

window.profBanner=()=>'<div class="card"><p class="note">اللي ظاهر دلوقتي: <b>'+profLabel()+'</b>. كل يوميات محفوظة على جهازك بس. نسخة تجريبية: يومياتك محفوظة على الجهاز ده بس، مش متشفرة ومش محمية بالحساب، ومفيش نسخة احتياطية على السيرفر. أي حد يفتح الجهاز وهو مفتوح يقدر يشوفها. متكتبيش بيانات شخصية حقيقية هنا.</p></div>';
window.claimCard=()=>{let h=profBanner();if(window.CLAIMMSG)h+='<div class="card"><p class="note" style="color:#b3414f">'+esc2(window.CLAIMMSG)+'</p></div>';
 if(!claimNeeded())return h;
 return h+'<div class="card"><h3>يوميات الجهاز دي لمين؟</h3><p class="note">فيه يوميات محفوظة على الجهاز ده من قبل ما تسجّلي دخول. الجهاز مش بيتحقق إنها بتاعتك، فمش هنربطها بالحساب ده من نفسنا. انقليها بس لو دي يومياتك.</p><button class="btn" onclick="claimFresh()">ابدئي بيوميات جديدة للحساب ده</button><p class="note">يوميات الجهاز تفضل زي ما هي على الجهاز ده، ومش هتظهر وإنتِ داخلة بالحساب ده، لكن هتظهر لأي حد يفتح التطبيق من غير حساب.</p><button class="btn" onclick="if(confirm(\'هننقل يوميات الجهاز للحساب ده على الجهاز ده بس، مش بتتبعت لأي سيرفر. بعد النقل هتلاقي يوميات الجهاز فاضية وإنتِ مش داخلة، ومش هتظهر غير مع الحساب ده. نكمل؟\'))claimDevice()">انقلي يومياتي الحالية للحساب ده</button></div>'};
window.profSwitch=()=>{PK=(()=>{const S=sess();return S&&/^[0-9a-f-]{36}$/.test(S.uid||'')?accKey(S.uid):K0})();try{D=JSON.parse(LS.getItem(PK)||'{}')}catch(e){D={}}if(PK!==K0&&D.theme===undefined){try{const dv=JSON.parse(LS.getItem(K0)||'{}');if(dv.theme!==undefined)D.theme=dv.theme}catch(e){}}try{sessionStorage.removeItem('sk_mk')}catch(e){}};
/* Identity is grounded: the uid must equal the JWT 'sub' (authS returns null otherwise), then the server confirms the token.
   401/403 after refresh = expired/invalid session: drop ONLY the session (records, push owner and need flag are kept), back to device view.
   Network failure = keep the session (cannot tell). Local profile separation is app-level, not a security boundary. */
window.sessVerify=async()=>{const S=sess();if(!S)return 'none';
 try{const r=await sbf('/auth/v1/user',{});if(r.status===401||r.status===403){LS.removeItem('sakan_auth');if(LS.getItem('sakan_push_owner'))LS.setItem('sakan_push_auth_need','1');profSwitch();try{IV.list=null;IV.msg='الجلسة خلصت أو اتلغت. سجّلي دخول تاني. يومياتك لسه محفوظة على الجهاز.'}catch(e){}render();return 'dropped'}return r.ok?'ok':'unknown'}catch(e){return 'offline'}};
window.claimFresh=()=>{window.CLAIMMSG='';render()};   // "fresh": nothing moves; card stays reachable on the account page until the account has its own records
window.claimDevice=()=>{window.CLAIMMSG='';const S=sess(),dst=PK;
 if(!S||dst===K0){window.CLAIMMSG='لازم تسجّلي دخول الأول.';render();return false}
 if(profHas(dst)){window.CLAIMMSG='الحساب ده عنده يوميات بالفعل. ما نقلناش حاجة عشان ما نخلطش.';render();return false}
 const src=LS.getItem(K0);if(src===null||!real(src)){window.CLAIMMSG='مفيش يوميات على الجهاز تتنقل.';render();return false}
 const hadDst=LS.getItem(dst);
 try{
  LS.setItem(dst,src);
  if(LS.getItem(dst)!==src)throw new Error('verify');
  JSON.parse(LS.getItem(dst));
  LS.setItem('sakan_v4_claimed','1');           // stops the one-time v3 import from re-filling the device profile
  LS.removeItem(K0);
  if(LS.getItem(K0)!==null)throw new Error('remove');
 }catch(e){                                      // rollback: device records restored exactly, account key restored
  try{LS.setItem(K0,src)}catch(x){}
  try{if(hadDst===null)LS.removeItem(dst);else LS.setItem(dst,hadDst)}catch(x){}
  try{LS.removeItem('sakan_v4_claimed')}catch(x){}
  window.CLAIMMSG='ما قدرناش ننقل اليوميات. ما اتغيّرش حاجة، يومياتك لسه على الجهاز زي ما هي.';D=(()=>{try{return JSON.parse(LS.getItem(PK)||'{}')}catch(x){return {}}})();render();return false}
 D=JSON.parse(LS.getItem(dst));window.CLAIMMSG='اتنقلت يومياتك للحساب ده على الجهاز.';render();return true};
window.wipeMsg=()=>{const S=sess();return S&&PK!==K0?'هيتمسح كل يوميات الحساب ده من الجهاز ده وهتخرجي من الحساب. يوميات الجهاز (من غير حساب) والحسابات التانية مش هتتمسح. لو فعّلتي التنبيهات هنحاول نمسحها من السيرفر، ولو النت مش شغال هنقولك.':'هيتمسح كل اللي اتحفظ في النسخة التجريبية دي على الجهاز ده من غير حساب. يوميات أي حساب تاني على الجهاز مش هتتمسح. النسخة القديمة v3 مش هتتمسح.'};
try{render()}catch(e){}
sessVerify();
})();
