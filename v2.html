<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سَكَن</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#f8b8cf">
<style>
:root{--pk:#f8b8cf;--pk2:#fde3ec;--gr:#2e5a3a;--gr2:#dcebdc;--yl:#fdf0c8;--tx:#4a2f3b;--mut:#9a7686}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;background:#fdf1f5;color:var(--tx);padding-bottom:84px}
.th{background:var(--pk);padding:18px 16px 14px;border-radius:0 0 28px 28px;box-shadow:0 4px 14px #e8739f33;position:sticky;top:0;z-index:5}
.th h1{margin:0;font-size:22px;color:var(--gr)}.th small{color:#7a4a5c}.tu{float:left;font-size:30px}
main{padding:12px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card{background:#fff;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 5px 0 #f1cfdb,0 8px 16px #e8739f22}
.card h3{margin:0 0 8px;font-size:17px;color:var(--gr)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{border:0;border-radius:22px;padding:16px 10px;font:inherit;font-size:16px;font-weight:700;color:var(--gr);text-align:center;box-shadow:0 5px 0 #0001;cursor:pointer}
.sec span{display:block;font-size:30px;margin-bottom:4px}
.c1{background:var(--gr2)}.c2{background:var(--pk2)}.c3{background:var(--yl)}.c4{background:#ece4f7}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed #f1d3de}.row:last-child{border:0}
.row label{flex:1}.row input[type=checkbox]{width:26px;height:26px;accent-color:#e8739f}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:2px solid var(--pk);background:#fff;border-radius:20px;padding:8px 14px;font:inherit;color:var(--gr);cursor:pointer}.chip.on{background:#e8739f;color:#fff;border-color:#e8739f}
input,textarea,select{font:inherit;width:100%;padding:11px;border-radius:14px;border:2px solid #f1cfdb;background:#fff;color:var(--tx);margin:4px 0}
.btn{display:block;width:100%;border:0;border-radius:22px;background:#e8739f;color:#fff;font:inherit;font-weight:700;font-size:16px;padding:13px;margin:8px 0;box-shadow:0 4px 0 #c4577f;cursor:pointer}
.btn.alt{background:var(--gr);box-shadow:0 4px 0 #1d3a25}.btn.red{background:#b3414f;box-shadow:0 4px 0 #7f2a34}
.mood{display:flex;justify-content:space-between;font-size:34px}.mood b{opacity:.45;cursor:pointer}.mood b.on{opacity:1;transform:scale(1.2)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #f1cfdb;padding-bottom:env(safe-area-inset-bottom);z-index:9}
.tabs a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mut);text-decoration:none}.tabs a span{display:block;font-size:24px}.tabs a.on{color:var(--gr);font-weight:700}
.note{font-size:12px;color:var(--mut);margin:6px 2px}.ph{background:#fff8e1;border:2px dashed #e6c86e;border-radius:16px;padding:12px;font-size:14px}
.brand{text-align:center;font-family:"Noto Serif",Georgia,serif;color:#8a6577;margin:18px 0 6px}
.cell{display:inline-block;width:14.2%;text-align:center;padding:8px 0;border-radius:10px;font-size:13px}
.bk{display:inline-block;width:46%;margin:2%;background:#fff;border-radius:16px;padding:10px;text-align:center;vertical-align:top;box-shadow:0 3px 0 #f1cfdb}
.bk i{display:block;height:100px;border-radius:8px;margin-bottom:6px;font-style:normal;line-height:100px;color:#fff;font-size:30px}
#cel{text-align:center;font-size:60px;animation:pop .8s}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
</style></head><body>
<div class="th"><span class="tu">🌷</span><h1 id="ti">سَكَن</h1><small id="sub">نسخة تجريبية، بيانات وهمية على جهازك بس</small></div>
<main id="m"></main>
<nav class="tabs" id="tb"></nav>
<script>
const $=s=>document.querySelector(s),K='sakan_v2';
let D=JSON.parse(localStorage.getItem(K)||'{}');const sv=()=>localStorage.setItem(K,JSON.stringify(D));
const g=(k,d)=>D[k]===undefined?d:D[k],st=(k,v)=>{D[k]=v;sv()};
const today=()=>new Date().toISOString().slice(0,10);
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=[['home','الرئيسية','🏠'],['god','علاقتي بربنا','🕌'],['day','يومياتي','📔'],['me','حسابي','👤']];
const SECS=[['god','علاقتي بربنا','🕌','c1'],['edu','تعليم','🎓','c4'],['day','يومياتي','📔','c2'],['health','صحتي','🌸','c2'],['books','كتبي','📚','c3'],['cal','التقويم','🗓️','c4'],['adhkar','المصحف والأذكار','📖','c1'],['help','مساعد سكن','💬','c3'],['month','إنجازات الشهر','🐣','c3'],['me','حسابي','👤','c2']];
const H={};
function shell(t,sub){$('#ti').textContent=t;$('#sub').textContent=sub||'نسخة تجريبية، بيانات وهمية على جهازك بس'}
function chips(id,opts,key,multi){const cur=g(key,multi?[]:'');return `<div class="chips" id="${id}">`+opts.map(o=>`<button class="chip ${(multi?cur.includes(o):cur===o)?'on':''}" data-o="${o}">${o}</button>`).join('')+`</div>`}
function bindChips(id,key,multi){document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{let c=g(key,multi?[]:'');const o=b.dataset.o;if(multi)c=c.includes(o)?c.filter(x=>x!==o):[...c,o];else c=o;st(key,c);render()})}
function checklist(key,items){const c=g(key+today(),{});return items.map((t,i)=>`<div class="row"><label for="${key}${i}">${t}</label><input type="checkbox" id="${key}${i}" ${c[i]?'checked':''} onchange="tg('${key}',${i},this.checked)"></div>`).join('')}
window.tg=(key,i,v)=>{const k=key+today(),c=g(k,{});c[i]=v;st(k,c);const a=g('ach',{});a[today()]=a[today()]||{};a[today()][key]=Object.values(c).filter(Boolean).length;st('ach',a)};
H.home=()=>{shell('سَكَن');return `<div class="g">`+SECS.map(s=>`<button class="sec ${s[3]}" onclick="go('${s[0]}')"><span>${s[2]}</span>${s[1]}</button>`).join('')+`</div><div class="card"><h3>أولويتي النهارده</h3><input id="pri" placeholder="أهم حاجة هركز عليها" value="${e(g('pri'+today(),''))}" onchange="st('pri'+today(),this.value)"><div class="chips"><button class="chip ${g('rest'+today())?'on':''}" onclick="st('rest'+today(),!g('rest'+today()));render()">🛋️ يوم راحة</button></div></div>`};
const PR=['الفجر','الظهر','العصر','المغرب','العشاء'];
H.god=()=>{shell('علاقتي بربنا','كل عبادة ليها علامة صح');return `<div class="card"><h3>🧎‍♀️ الصلوات على سجادة الصلاة</h3>${checklist('pr',PR)}</div><div class="card"><h3>نوافل وأوراد</h3>${checklist('nw',['السنن الرواتب','شفع ووتر','قيام الليل','الضحى','آية الكرسي بعد الصلاة','أذكار الصباح','أذكار المساء','ورد القرآن','حفظ جديد','مراجعة الحفظ'])}</div><p class="note">العلامات بتتحفظ على جهازك للتجربة.</p>`};
H.adhkar=()=>{shell('المصحف والأذكار');return `<div class="card"><h3>📖 المصحف</h3><div class="ph">نسخة المصحف جوه التطبيق هتتحط من مصدر موثق (مصحف المدينة). دلوقتي: <a href="https://quran.com/" target="_blank">فتح المصحف على موقع خارجي</a></div></div>`+['أذكار الصباح 🌅','أذكار المساء 🌇','أذكار النوم 🌙'].map(t=>`<div class="card"><h3>${t}</h3><div class="ph">صورة الأذكار والنص هيتحطوا من مصدر موثق، مش مكتوبين من الذاكرة.</div></div>`).join('')+`<div class="card"><h3>⏰ وقت نومي</h3><input type="time" value="${g('sleep','22:30')}" onchange="st('sleep',this.value)"><p class="note">التذكير بأذكار النوم وسورة الملك محتاج اختبار على الموبايل، مش متأكد إنه بيوصل والتطبيق مقفول.</p></div>`};
H.day=()=>{shell('يومياتي','النهارده');const mo=g('mood'+today(),-1);return `<div class="card"><h3>مزاجي</h3><div class="mood">`+['😔','😕','😐','🙂','😄'].map((x,i)=>`<b class="${mo===i?'on':''}" onclick="st('mood${today()}',${i});render()">${x}</b>`).join('')+`</div></div>`+['الصبح ☀️','العصر 🌤️','المغرب 🌙'].map((t,i)=>`<div class="card"><h3>${t}</h3><div id="tk${i}">${(g('tasks'+i+today(),[])).map((x,j)=>`<div class="row"><label>${e(x.t)}</label><input type="checkbox" ${x.d?'checked':''} onchange="tk(${i},${j},this.checked)"></div>`).join('')}</div><input id="nt${i}" placeholder="مهمة جديدة"><button class="btn" onclick="at(${i})">إضافة</button></div>`).join('')+`<div class="card"><h3>🌼 امتنان اليوم</h3><textarea rows=2 onchange="st('grat${today()}',this.value)">${e(g('grat'+today(),''))}</textarea></div><div class="card"><h3>جملة آخر اليوم (اختياري)</h3><input value="${e(g('end'+today(),''))}" onchange="st('end${today()}',this.value)"></div><p class="note">المهام مش بتترحّل لوحدها لليوم التاني.</p>`};
window.at=i=>{const v=$('#nt'+i).value.trim();if(!v)return;const k='tasks'+i+today(),a=g(k,[]);a.push({t:v,d:false});st(k,a);render()};
window.tk=(i,j,v)=>{const k='tasks'+i+today(),a=g(k,[]);a[j].d=v;st(k,a);const x=g('ach',{});x[today()]=x[today()]||{};x[today()].tasks=[0,1,2].reduce((s,n)=>s+g('tasks'+n+today(),[]).filter(t=>t.d).length,0);st('ach',x)};
H.edu=()=>{shell('تعليم');const cs=g('courses',[]);return `<div class="card"><h3>🎓 كورساتي</h3>`+cs.map((c,i)=>`<div class="row"><label><b>${e(c.n)}</b><br><small>آخر درس: ${e(c.l)} | الخطوة الجاية: ${e(c.x)}</small></label></div>`).join('')+`<input id="cn" placeholder="اسم الكورس"><input id="cl" placeholder="آخر درس"><input id="cx" placeholder="الخطوة الجاية"><button class="btn" onclick="ac()">إضافة كورس</button></div><div class="card"><h3>عدّاد الأسبوع</h3>`+['تجويد','تفسير','فقه'].map(t=>`<div class="row"><label>${t}</label><button class="chip" onclick="wk('${t}',-1)">−</button><b>${g('wk'+t,0)}</b><button class="chip" onclick="wk('${t}',1)">+</button></div>`).join('')+`</div>`};
window.ac=()=>{const n=$('#cn').value.trim();if(!n)return;const a=g('courses',[]);a.push({n,l:$('#cl').value,x:$('#cx').value});st('courses',a);render()};window.wk=(t,d)=>{st('wk'+t,Math.max(0,g('wk'+t,0)+d));render()};
H.health=()=>{shell('عنايتي بنفسي','صحتك في مكان واحد');return `<button class="sec c1" style="width:100%;margin:6px 0" onclick="go('sport')"><span>🏋️</span>رياضتي</button><button class="sec c2" style="width:100%;margin:6px 0" onclick="go('hawwa')"><span>🩸</span>دورتي الشهرية (حوّاء)</button><button class="sec c3" style="width:100%;margin:6px 0" onclick="go('body')"><span>⚖️</span>جسمي ووزني</button><p class="note">كل حاجة هنا أمثلة للتجربة، مش نصايح طبية.</p>`};
H.sport=()=>{shell('رياضتي');return `<div class="card"><h3>فيديو ١٠ دقايق كل يوم</h3><div class="ph">قايمة فيديوهات مراجَعة (مشي في البيت، تمارين خفيفة للمبتدئات) هتتحط بعد ما نراجعها. الزرار هيفتح يوتيوب.</div><label>وقت التذكير</label><input type="time" value="${g('sptime','17:00')}" onchange="st('sptime',this.value)"></div>`+`<div class="card"><h3>عملت تمرين النهارده؟</h3>${checklist('sp',['خلصت ١٠ دقايق'])}</div>`};
H.hawwa=()=>{shell('حاسّة بإيه النهارده؟','حوّاء');const mo=g('hm'+today(),-1);return `<div class="card"><h3>مزاجي</h3><div class="mood">`+['😔','😕','😐','🙂','😄'].map((x,i)=>`<b class="${mo===i?'on':''}" onclick="st('hm${today()}',${i});render()">${x}</b>`).join('')+`</div></div><div class="card"><h3>اللي حاسة بيه</h3>${chips('sy',['تعب','وجع','صداع','انتفاخ','تقلب مزاج','نوم زيادة'],'sy'+today(),true)}</div><div class="card"><h3>وسيلة منع الحمل (اختياري)</h3>${chips('me2',['حبوب','لولب','حقن','غرسة','وسيلة تانية'],'meth',false)}</div><div class="card"><h3>إعدادات الدورة</h3><label>بتيجي كل كام يوم</label><input type="number" value="${g('cyc',28)}" onchange="st('cyc',+this.value)"><label>عدد أيام الدورة</label><input type="number" value="${g('plen',5)}" onchange="st('plen',+this.value)"><label>أول يوم في آخر دورة</label><input type="date" value="${g('last','')}" onchange="st('last',this.value);render()">${hcal()}</div><button class="btn" onclick="alert('اتحفظ على جهازك (تجربة)')">سجّلي النهارده</button><p class="note">الأيام المتوقعة تقديرية، مش تشخيص ولا وسيلة لمنع الحمل. بيانات حسّاسة، ومتخزّنة على جهازك بس في التجربة.</p>`};
function hcal(){const l=g('last','');if(!l)return '<p class="note">اختاري أول يوم لتظهر الأيام المتوقعة.</p>';const c=g('cyc',28),p=g('plen',5),s=new Date(l+'T00:00:00');let h='<div style="margin-top:8px">';for(let i=0;i<c;i++){const d=new Date(s);d.setDate(d.getDate()+i);const bg=i<p?'#f6a6c0':(i>=c-18&&i<=c-12)?'#bfe0f5':'#fff4f8';h+=`<span class="cell" style="background:${bg}">${d.getDate()}</span>`}return h+'</div><p class="note">🩷 أيام الدورة المتوقعة | 💙 أيام الخصوبة المتوقعة (تقدير)</p>'}
H.body=()=>{shell('جسمي ووزني','سجّلي النهارده');return `<div class="card"><h3>هدفي</h3>${chips('gl',['أخس','أحافظ على جسمي','أزيد'],'goal',false)}</div><div class="card"><h3>وزني النهارده (كجم)</h3><input type="number" step="0.1" value="${g('w'+today(),'')}" onchange="st('w${today()}',this.value)"><h3>وزني المستهدف</h3><input type="number" step="0.1" value="${g('wt','')}" onchange="st('wt',this.value)"></div><div class="card"><h3>مقاساتي بالسنتيمتر</h3>`+['الوسط','الصدر','الورك','الذراع','الفخذ'].map(t=>`<label>${t}</label><input type="number" value="${g('ms'+t,'')}" onchange="st('ms${t}',this.value)">`).join('')+`</div><p class="note">الأرقام أمثلة، مش بنقول نصايح طبية.</p>`};
H.books=()=>{shell('كتبي','الكتب اللي بقراها');const b=g('books',[]);const cl=['#e8739f','#5c9b66','#8a6fc1','#d4a62a'];return `<div>`+b.map((x,i)=>`<div class="bk" onclick="go('book${i}')"><i style="background:${cl[i%4]}">🌷</i><b>${e(x.n)}</b><br><small>${x.q.length} اقتباسات</small></div>`).join('')+`</div><div class="card"><input id="bn" placeholder="اسم الكتاب (وهمي)"><button class="btn" onclick="ab()">إضافة كتاب</button></div>`};
window.ab=()=>{const n=$('#bn').value.trim();if(!n)return;const a=g('books',[]);a.push({n,q:[]});st('books',a);render()};
function book(i){const b=g('books',[])[i];if(!b){return H.books()}shell(b.n,'اقتباساتي');return b.q.map((q,j)=>`<div class="card"><p>«${e(q.t)}»</p><small>${e(q.p||'')}</small><button class="btn alt" onclick="sh(${i},${j})">شاركيها كصورة</button></div>`).join('')+`<div class="card"><textarea id="qt" rows=3 placeholder="اقتباس (وهمي)"></textarea><input id="qp" placeholder="رقم الصفحة"><button class="btn" onclick="aq(${i})">إضافة اقتباس</button></div><canvas id="cv" width="1080" height="1080" style="width:100%;border-radius:16px;display:none"></canvas>`}
window.aq=i=>{const t=$('#qt').value.trim();if(!t)return;const a=g('books',[]);a[i].q.push({t,p:$('#qp').value});st('books',a);render()};
window.sh=(i,j)=>{const b=g('books',[])[i],q=b.q[j],c=$('#cv'),x=c.getContext('2d');c.style.display='block';x.fillStyle='#fde3ec';x.fillRect(0,0,1080,1080);x.fillStyle='#fff';x.beginPath();x.roundRect(60,60,960,960,60);x.fill();x.direction='rtl';x.textAlign='center';x.fillStyle='#2e5a3a';x.font='bold 54px system-ui';const w=q.t.split(' ');let L=[],cur='';w.forEach(a=>{if((cur+' '+a).length>22){L.push(cur);cur=a}else cur=cur?cur+' '+a:a});L.push(cur);L.slice(0,8).forEach((l,n)=>x.fillText(l,540,300+n*80));x.font='40px system-ui';x.fillStyle='#9a7686';x.fillText('— '+b.n,540,900);x.font='34px Georgia';x.fillText('Mariam studio',540,985);c.toBlob(async bl=>{const f=new File([bl],'sakan-quote.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='sakan-quote.png';a.click()}})};
H.cal=()=>{shell('التقويم','مواعيدي وتذكيراتي');const a=g('apps',[]).sort((x,y)=>(x.d+x.t).localeCompare(y.d+y.t));return `<div class="card"><h3>القادم</h3>`+(a.map(x=>`<div class="row"><label>🔔 ${e(x.n)}<br><small>${x.d} ${x.t}</small></label></div>`).join('')||'<p class="note">مفيش مواعيد.</p>')+`</div><div class="card"><input id="an" placeholder="الموعد"><input id="ad" type="date"><input id="at" type="time"><button class="btn" onclick="aa()">إضافة</button><p class="note">تنبيه الموبايل والتطبيق مقفول لسه ما اتجربش.</p></div>`};
window.aa=()=>{const n=$('#an').value.trim(),d=$('#ad').value,t=$('#at').value;if(!n||!d)return;const a=g('apps',[]);a.push({n,d,t:t||'00:00'});st('apps',a);render()};
H.help=()=>{shell('مساعد سَكَن','بيساعدك تلاقي حاجتك، مش ذكاء اصطناعي');return `<div class="g"><button class="sec c3" onclick="go('cal')"><span>🗓️</span>مواعيدي النهارده</button><button class="sec c1" onclick="go('day')"><span>🎯</span>مهامي</button><button class="sec c2" onclick="go('books')"><span>📚</span>اقتباساتي</button><button class="sec c4" onclick="go('month')"><span>🐣</span>إنجازاتي</button></div><div class="card"><input id="sq" placeholder="دوري في كتاباتي أنا بس"><button class="btn" onclick="ss()">بحث</button><div id="sr"></div></div>`};
window.ss=()=>{const q=$('#sq').value.trim();if(!q)return;const hits=[];Object.keys(D).forEach(k=>{const s=JSON.stringify(D[k]);if(!/^(sakan|ach)/.test(k)&&s.includes(q))hits.push(k+': '+s.slice(0,80))});$('#sr').innerHTML=hits.length?hits.map(h=>`<p class="note">${e(h)}</p>`).join(''):'<p class="note">مفيش نتيجة.</p>'};
const KH=['كل خطوة صغيرة بتعدّي، والأثر بيفضل.','النية الطيبة نص الطريق.','اللي بيبدأ ببسم الله بيلاقي البركة.'];
H.month=()=>{shell('إنجازات الشهر','أشطر كتكوت 🐣');const a=g('ach',{});const m=today().slice(0,7);let pr=0,tk=0,days=0;Object.keys(a).filter(k=>k.startsWith(m)).forEach(k=>{days++;pr+=a[k].pr||0;tk+=a[k].tasks||0});return `<div class="card"><div id="cel">🐣🎉</div><h3 style="text-align:center">أشطر كتكوت!</h3><div class="row"><label>أيام سجّلتي فيها</label><b>${days}</b></div><div class="row"><label>صلوات اتعلّمت</label><b>${pr}</b></div><div class="row"><label>مهام خلصتيها</label><b>${tk}</b></div><p style="text-align:center">«${KH[new Date().getMonth()%3]}»</p></div><p class="note">الأرقام من بيانات التجربة، والخاطرة بتتغير كل شهر.</p>`};
H.me=()=>{shell('حسابي');const inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone;return `<div class="card"><h3>حالة التثبيت</h3><p>${inst?'✅ مفتوح من أيقونة الشاشة الرئيسية':'لسه في المتصفح'}</p></div><div class="card"><h3>الشكل</h3>${chips('th',['بينك','أخضر'],'theme',false)}</div><div class="card"><h3>بياناتي</h3><button class="btn red" onclick="if(confirm('مسح كل بيانات التجربة من الجهاز؟')){localStorage.removeItem('${K}');D={};render()}">مسح بياناتي</button><p class="note">تسجيل الدخول بالإيميل والمسح من السيرفر لسه ما اتوصلوش بالشكل ده، اتجرّبوا في صفحة منفصلة.</p></div>`};

 $('#tb').innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="${r===t[0]?'on':''}"><span>${t[2]}</span>${t[1]}</a>`).join('');
 if(g('theme')==='أخضر'){document.documentElement.style.setProperty('--pk','#bfdcbf');document.body.style.background='#f1f8f1'}else{document.documentElement.style.setProperty('--pk','#f8b8cf');document.body.style.background='#fdf1f5'}
