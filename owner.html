<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم سَكَن</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,"Noto Naskh Arabic",sans-serif;background:#f4f1dc;color:#2b3314;margin:0;padding:14px;max-width:560px;margin-inline:auto}h1{font-size:20px}.c{background:#fff;border:2px solid #d8d3a0;border-radius:18px;padding:12px;margin:10px 0}input,button{font:inherit;padding:10px;border-radius:12px;border:2px solid #cfc98f;width:100%;margin:4px 0}button{background:#4d5a22;color:#fff;border:0;font-weight:700;cursor:pointer}button.s{background:#e6ebd2;color:#2b3314;width:auto;padding:6px 12px}.r{display:flex;gap:8px;align-items:center}.r input[type=text]{flex:1}.r input[type=checkbox]{width:24px;height:24px}.n{font-size:12px;color:#5b6638}</style></head><body>
<h1>لوحة تحكم سَكَن (تجربة)</h1><p class="n">التغييرات هنا بتغيّر الشكل والأسماء عند كل المستخدمات. بيانات الصحة والدورة والمزاج مش بتعدّي من هنا أبدًا، وبتفضل على جهاز كل واحدة.</p>
<div id="app"></div>
<script>
const U='https://pmpxuvyzsgmrwdvpzmde.supabase.co',K='sb_publishable_KUBNVIdjcudn88AjZeirUg_dx8xrKXc';
const SECS=[['god','علاقتي بربنا'],['edu','كورساتي'],['day','يومياتي'],['health','صحتي'],['books','كتبي'],['cal','التقويم'],['adhkar','المصحف والأذكار'],['help','مساعد سكن'],['month','إنجازات الشهر'],['me','حسابي']];
let tok=null,cfg={v:1,labels:{},hidden:[],order:[],colors:{}},ver=1;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function login(){const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})});const j=await r.json();if(!r.ok){$('#msg').textContent='الدخول ما نفعش: '+(j.msg||j.error_description||r.status);return}tok=j.access_token;await load();draw()}
async function load(){const r=await fetch(U+'/rest/v1/app_config?id=eq.1&select=v,config',{headers:{apikey:K,Authorization:'Bearer '+(tok||K)}});const j=await r.json();if(j[0]){ver=j[0].v;cfg=Object.assign({labels:{},hidden:[],order:[],colors:{}},j[0].config)}}
function order(){const o=cfg.order&&cfg.order.length?cfg.order.slice():[];SECS.forEach(s=>{if(!o.includes(s[0]))o.push(s[0])});return o}
function draw0(){if(!tok){$('#app').innerHTML='<div class="c"><input id="em" type="email" placeholder="الإيميل" autocomplete="username"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"><button onclick="login()">دخول</button><p id="msg" class="n"></p></div>';return}
const o=order();$('#app').innerHTML='<div class="c"><b>الأقسام</b>'+o.map((k,i)=>{const s=SECS.find(x=>x[0]===k);return '<div class="r"><input type="checkbox" '+(cfg.hidden.includes(k)?'':'checked')+' onchange="tg(\''+k+'\')"><input type="text" value="'+esc(cfg.labels[k]||s[1])+'" onchange="lb(\''+k+'\',this.value)"><button class="s" onclick="mv('+i+',-1)">↑</button><button class="s" onclick="mv('+i+',1)">↓</button></div>'}).join('')+'<p class="n">العلامة = القسم ظاهر. الاسم الأصلي بيرجع لو مسحتي الخانة.</p></div><div class="c"><b>لون الأساس (للثيم البينك)</b><input type="color" value="'+(cfg.colors['--pk']||'#f8b8cf')+'" onchange="cl(this.value)"><button class="s" onclick="cl(null)">رجّعي الافتراضي</button></div><button onclick="save()">حفظ ونشر لكل المستخدمات</button><p id="msg" class="n">النسخة الحالية: '+ver+'</p>'}
window.tg=k=>{const i=cfg.hidden.indexOf(k);i<0?cfg.hidden.push(k):cfg.hidden.splice(i,1)};
window.lb=(k,v)=>{v=v.trim();if(v)cfg.labels[k]=v;else delete cfg.labels[k]};
window.mv=(i,d)=>{const o=order(),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];cfg.order=o;draw()};
window.cl=v=>{if(v)cfg.colors['--pk']=v;else delete cfg.colors['--pk']};
async function save(){const m=t=>{const e=document.getElementById('msg');if(e)e.textContent=t};try{const nv=ver+1,body={v:nv,config:Object.assign({},cfg,{v:nv}),updated_at:new Date().toISOString()};const r=await fetch(U+'/rest/v1/app_config?id=eq.1',{method:'PATCH',headers:{apikey:K,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});let j=null;try{j=await r.json()}catch(x){}if(r.ok&&Array.isArray(j)&&j.length){ver=nv;m('اتحفظ. النسخة '+nv)}else m('ما اتحفظش: الحساب ده مش مالكة اللوحة (رمز '+r.status+')')}catch(x){m('ما اتحفظش: مشكلة اتصال')}}
function draw(){draw0();if(tok){$('#app').insertAdjacentHTML('beforeend','<div class="c" id="invs"><b>دعوات الناس (تجربة خاصة)</b><div id="il"><p class="n">بنحمّل...</p></div></div>');loadInv()}}
async function sb(p,o){o=o||{};return fetch(U+p,{method:o.method||'GET',headers:Object.assign({apikey:K,Authorization:'Bearer '+tok,'Content-Type':'application/json'},o.headers||{}),body:o.body})}
async function loadInv(){const el=document.getElementById('il');if(!el)return;try{const a=await sb('/rest/v1/invites?select=id,url,status,created_at&order=created_at.desc&limit=200'),b=await sb('/rest/v1/invite_reports?select=invite_id&limit=1000');const L=a.ok?await a.json():[],R=b.ok?await b.json():[];const cnt={};R.forEach(x=>cnt[x.invite_id]=(cnt[x.invite_id]||0)+1);el.innerHTML=L.length?L.map(x=>'<div class="c"><p dir="ltr" style="word-break:break-all">'+esc(x.url)+'</p><p class="n">'+({pending:'مستني المراجعة',approved:'ظاهر للناس',rejected:'مرفوض'}[x.status]||esc(x.status))+(cnt[x.id]?' · بلاغات: '+cnt[x.id]:'')+'</p><div class="r"><button class="s" onclick="invSet(\''+esc(x.id)+'\',\'approved\')">وافقي</button><button class="s" onclick="invSet(\''+esc(x.id)+'\',\'rejected\')">ارفضي</button><button class="s" onclick="invRm(\''+esc(x.id)+'\')">امسحي</button></div></div>').join(''):'<p class="n">مفيش دعوات لسه. مفيش لينكات حقيقية متزرعة.</p>'}catch(e){el.textContent='مقدرناش نحمّل الدعوات.'}}
window.invSet=async(id,st)=>{await sb('/rest/v1/invites?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:st})});loadInv()};
window.invRm=async id=>{if(!confirm('تمسحي الرابط ده نهائي؟'))return;await sb('/rest/v1/invites?id=eq.'+encodeURIComponent(id),{method:'DELETE'});loadInv()};
window.login=login;window.save=save;draw();
</script></body></html>
