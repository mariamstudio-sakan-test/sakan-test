<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سَكَن</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#f8b8cf">
<style>
:root{--pk:#f8b8cf;--pk2:#fde3ec;--gr:#2e5a3a;--gr2:#dcebdc;--yl:#fdf0c8;--tx:#4a2f3b;--mut:#9a7686}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;background:#fdf1f5;color:var(--tx);padding-bottom:84px}
.th{background:var(--pk);padding:18px 16px 14px;border-radius:0 0 28px 28px;box-shadow:0 4px 14px #e8739f33;position:sticky;top:0;z-index:5}
.th h1{margin:0;font-size:22px;color:var(--gr)}.th small{color:#6b3f51}.tu{float:left;width:84px;height:46px;margin-top:-6px}.ic{width:1em;height:1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sec .ic{width:34px;height:34px;display:block;margin:0 auto 6px}.tabs .ic{width:26px;height:26px;display:block;margin:0 auto 2px}.mood svg{width:44px;height:44px}
main{padding:12px}
.card{background:#fff;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 5px 0 #f1cfdb,0 8px 16px #e8739f22}
.card h3{margin:0 0 8px;font-size:17px;color:var(--gr)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{border:0;border-radius:22px;padding:16px 10px;font:inherit;font-size:16px;font-weight:700;color:var(--gr);text-align:center;box-shadow:0 5px 0 #0001;cursor:pointer}

.c1{background:var(--gr2)}.c2{background:var(--pk2)}.c3{background:var(--yl)}.c4{background:#ece4f7}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed #f1d3de}.row:last-child{border:0}
.row label{flex:1}.row input[type=checkbox]{width:26px;height:26px;accent-color:#e8739f}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:2px solid var(--pk);background:#fff;border-radius:20px;padding:8px 14px;font:inherit;color:var(--gr);cursor:pointer}.chip.on{background:#e8739f;color:#fff;border-color:#e8739f}
input,textarea,select{font:inherit;width:100%;padding:11px;border-radius:14px;border:2px solid #f1cfdb;background:#fff;color:var(--tx);margin:4px 0}
.btn{display:block;width:100%;border:0;border-radius:22px;background:#e8739f;color:#fff;font:inherit;font-weight:700;font-size:16px;padding:13px;margin:8px 0;box-shadow:0 4px 0 #c4577f;cursor:pointer}
.btn.alt{background:var(--gr);box-shadow:0 4px 0 #1d3a25}.btn.red{background:#b3414f;box-shadow:0 4px 0 #7f2a34}
.mood{display:flex;justify-content:space-between}.mood b{opacity:.55;cursor:pointer;line-height:0}.mood b.on{opacity:1;transform:scale(1.15)}.mood b.on circle.f{fill:#f8b8cf}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #f1cfdb;padding-bottom:env(safe-area-inset-bottom);z-index:9}
.tabs a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mut);text-decoration:none}.tabs a.on{color:var(--gr);font-weight:700}
.note{font-size:12px;color:var(--mut);margin:6px 2px}.ph{background:#fff8e1;border:2px dashed #e6c86e;border-radius:16px;padding:12px;font-size:14px}
.brand{text-align:center;font-family:"Noto Serif",Georgia,serif;color:#8a6577;margin:18px 0 6px}
.cell{display:inline-block;width:14.2%;text-align:center;padding:8px 0;border-radius:10px;font-size:13px}
.bk{display:inline-block;width:46%;margin:2%;background:#fff;border-radius:16px;padding:10px;text-align:center;vertical-align:top;box-shadow:0 3px 0 #f1cfdb}
.bk i{display:flex;align-items:center;justify-content:center;height:110px;border-radius:6px 12px 12px 6px;margin-bottom:6px;font-style:normal;color:#fff;border-inline-start:8px solid #0002}.bk i svg{width:46px;height:46px}.bk b{color:var(--tx)}.bk small{color:var(--mut)}
.pick{display:flex;align-items:center;justify-content:space-between;width:100%;border:2px solid var(--pk);background:#fff;border-radius:18px;padding:12px;font:inherit;color:var(--tx);cursor:pointer;margin-top:4px}.pick span{color:var(--gr);font-weight:700}
.ov{position:fixed;inset:0;background:#4a2f3b99;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.ov .box{background:#fff;border-radius:24px;padding:16px;width:100%;max-width:380px;max-height:80vh;overflow:auto}.ov h3{margin:0 0 8px;color:var(--gr)}.ov .row label{font-size:16px}.ov input[type=radio]{width:24px;height:24px;accent-color:#e8739f}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.pill{border:0;border-radius:20px;padding:8px 14px;font:inherit;background:var(--pk2);color:var(--gr);cursor:pointer}.pill.on{background:#e8739f;color:#fff}
.q{background:var(--pk2)}.q.g2{background:var(--gr2)}.q p{margin:0 0 6px;color:var(--tx);font-size:16px}.q small{color:#6b3f51}
.bar{height:12px;border-radius:8px;background:#fff;border:2px solid var(--pk);overflow:hidden}.bar i{display:block;height:100%;background:#e8739f}
.chk{width:70px;height:70px;display:block;margin:0 auto}
#cel{text-align:center}
</style></head><body>
<div class="th"><span id="tul"></span><h1 id="ti">سَكَن</h1><small id="sub">نسخة تجريبية، بيانات وهمية على جهازك بس</small></div>
<main id="m"></main>
<nav class="tabs" id="tb"></nav>
<script>
const $=s=>document.querySelector(s),K='sakan_v2';
let D=JSON.parse(localStorage.getItem(K)||'{}');const sv=()=>localStorage.setItem(K,JSON.stringify(D));
const g=(k,d)=>D[k]===undefined?d:D[k],st=(k,v)=>{D[k]=v;sv()};
const today=()=>new Date().toISOString().slice(0,10);
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=[['home','الرئيسية','home'],['god','علاقتي بربنا','god'],['day','يومياتي','day'],['me','حسابي','me']];
const SECS=[['god','علاقتي بربنا','god','c1'],['edu','تعليم','edu','c4'],['day','يومياتي','day','c2'],['health','صحتي','health','c2'],['books','كتبي','books','c3'],['cal','التقويم','cal','c4'],['adhkar','المصحف والأذكار','quran','c1'],['help','مساعد سكن','chat','c3'],['month','إنجازات الشهر','star','c3'],['me','حسابي','me','c2']];
const P={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',god:'M5 21v-9a7 7 0 0114 0v9M2 21h20M12 2v3',day:'M5 3h12a2 2 0 012 2v16H7a2 2 0 01-2-2zM9 8h6M9 12h6',me:'M12 12a4 4 0 100-8 4 4 0 000 8M4 21c0-4 4-6 8-6s8 2 8 6',edu:'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5',health:'M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z',books:'M4 4h4v16H4zM10 4h4v16h-4zM16 6l4 1-3 13-4-1z',cal:'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4',quran:'M12 6c-2-2-6-2-9-1v14c3-1 7-1 9 1 2-2 6-2 9-1V5c-3-1-7-1-9 1zM12 6v14',chat:'M4 5h16v11H9l-5 4z',star:'M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.7l6.2-.9z',sport:'M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12',drop:'M12 3c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-6 6-11z',scale:'M4 4h16v16H4zM8 9a4 4 0 018 0M12 9l2-2',moon:'M20 14A8 8 0 019 3a9 9 0 1011 11z',bell:'M6 17v-6a6 6 0 0112 0v6l2 2H4zM10 21h4',sun:'M12 8a4 4 0 100 8 4 4 0 000-8M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2',sunset:'M3 18h18M7 18a5 5 0 0110 0M12 8v3M4 12l2 1M20 12l-2 1',flower:'M12 9a3 3 0 100 6 3 3 0 000-6M12 9c-2-4 0-6 0-6s2 2 0 6M12 15c-2 4 0 6 0 6s2-2 0-6M9 12c-4-2-6 0-6 0s2 2 6 0M15 12c4-2 6 0 6 0s-2 2-6 0',check:'M5 13l4 4L19 7',chev:'M6 9l6 6 6-6',plus:'M12 5v14M5 12h14',tulip:'M12 21V10M12 10c-4 0-5-5-4-8 2 1 3 2 4 3 1-1 2-2 4-3 1 3 0 8-4 8z'};
const I=(n,c)=>`<svg class="ic" viewBox="0 0 24 24" ${c?'style="color:'+c+'"':''}><path d="${P[n]||P.star}"/></svg>`;
const TULIP='<svg class="tu" viewBox="0 0 84 46"><g stroke="#2e5a3a" stroke-width="2" fill="none" stroke-linecap="round"><path d="M16 46V22M42 46V16M68 46V24"/><path d="M16 38c-6-2-8-6-8-6M42 36c7-2 9-8 9-8M68 40c-5-1-8-5-8-5"/></g><path d="M16 22c-7 0-9-9-7-13 3 2 5 3 7 5 2-2 4-3 7-5 2 4 0 13-7 13z" fill="#e8739f"/><path d="M42 16c-6 0-8-8-6-12 3 2 4 3 6 5 2-2 3-3 6-5 2 4 0 12-6 12z" fill="#fde28a"/><path d="M68 24c-6 0-8-8-6-12 3 2 4 3 6 5 2-2 3-3 6-5 2 4 0 12-6 12z" fill="#f48fb1"/></svg>';
const MAT='<svg viewBox="0 0 120 70" style="width:120px;display:block;margin:0 auto 6px"><rect x="10" y="4" width="100" height="62" rx="8" fill="#dcebdc" stroke="#2e5a3a" stroke-width="2"/><path d="M36 62V34a24 24 0 0148 0v28z" fill="#f8b8cf" stroke="#2e5a3a" stroke-width="2"/><path d="M48 62V38a12 12 0 0124 0v24z" fill="#fff" stroke="#e8739f" stroke-width="2"/><path d="M60 8v8M54 12h12" stroke="#2e5a3a" stroke-width="2" stroke-linecap="round"/><path d="M10 12h6M10 20h6M10 28h6M104 12h6M104 20h6M104 28h6" stroke="#2e5a3a" stroke-width="2"/></svg>';
const CHICK='<svg class="chk" viewBox="0 0 80 80"><circle cx="40" cy="46" r="26" fill="#fde28a" stroke="#c9a227" stroke-width="2"/><circle cx="31" cy="42" r="3" fill="#4a2f3b"/><circle cx="49" cy="42" r="3" fill="#4a2f3b"/><path d="M36 50l4 5 4-5z" fill="#f08a3c"/><path d="M34 20c2 4 4 6 6 6s4-2 6-6" stroke="#c9a227" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M12 48c-5 2-6 8-6 8M68 48c5 2 6 8 6 8" stroke="#c9a227" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
const MO=[['M8 17c2-2 6-2 8 0','M8 10l2 1M16 10l-2 1'],['M8 16c2-1 6-1 8 0',''],['M8 15h8',''],['M8 14c2 2 6 2 8 0',''],['M7 13c1 4 9 4 10 0','']];
const FACE=(i)=>`<svg viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="10.5" fill="#fff" stroke="#e8739f" stroke-width="1.6"/><circle cx="8.6" cy="9.5" r="1.1" fill="#4a2f3b"/><circle cx="15.4" cy="9.5" r="1.1" fill="#4a2f3b"/><path d="${MO[i][0]}" stroke="#4a2f3b" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`;
const MOODS=i=>[0,1,2,3,4].map(x=>`<b class="${i===x?'on':''}" onclick="MD(${x})">${FACE(x)}</b>`).join('');
const H={};
function shell(t,sub){$('#ti').textContent=t;$('#sub').textContent=sub||'نسخة تجريبية، بيانات وهمية على جهازك بس'}
function chips(id,opts,key,multi){const cur=g(key,multi?[]:'');return `<div class="chips" id="${id}">`+opts.map(o=>`<button class="chip ${(multi?cur.includes(o):cur===o)?'on':''}" data-o="${o}">${o}</button>`).join('')+`</div>`}
function bindChips(id,key,multi){document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{let c=g(key,multi?[]:'');const o=b.dataset.o;if(multi)c=c.includes(o)?c.filter(x=>x!==o):[...c,o];else c=o;st(key,c);render()})}
function checklist(key,items){const c=g(key+today(),{});return items.map((t,i)=>`<div class="row"><label for="${key}${i}">${t}</label><input type="checkbox" id="${key}${i}" ${c[i]?'checked':''} onchange="tg('${key}',${i},this.checked)"></div>`).join('')}
window.tg=(key,i,v)=>{const k=key+today(),c=g(k,{});c[i]=v;st(k,c);const a=g('ach',{});a[today()]=a[today()]||{};a[today()][key]=Object.values(c).filter(Boolean).length;st('ach',a)};
H.home=()=>{shell('سَكَن');return `<div class="g">`+SECS.map(s=>`<button class="sec ${s[3]}" onclick="go('${s[0]}')">${I(s[2])}${s[1]}</button>`).join('')+`</div><div class="card"><h3>أولويتي النهارده</h3><input id="pri" placeholder="أهم حاجة هركز عليها" value="${e(g('pri'+today(),''))}" onchange="st('pri'+today(),this.value)"><div class="chips"><button class="chip ${g('rest'+today())?'on':''}" onclick="st('rest'+today(),!g('rest'+today()));render()">${I('moon')} يوم راحة</button></div></div>`};
const PR=['الفجر','الظهر','العصر','المغرب','العشاء'];
H.god=()=>{shell('علاقتي بربنا','كل عبادة ليها علامة صح');return `<div class="card"><h3>الصلوات على سجادة الصلاة</h3>${MAT}${checklist('pr',PR)}</div><div class="card"><h3>نوافل وأوراد</h3>${checklist('nw',['السنن الرواتب','شفع ووتر','قيام الليل','الضحى','آية الكرسي بعد الصلاة','أذكار الصباح','أذكار المساء','ورد القرآن','حفظ جديد','مراجعة الحفظ'])}</div><p class="note">العلامات بتتحفظ على جهازك للتجربة.</p>`};
H.adhkar=()=>{shell('المصحف والأذكار');return `<div class="card"><h3>${I('quran')} المصحف</h3><div class="ph">نسخة المصحف جوه التطبيق هتتحط من مصدر موثق (مصحف المدينة). دلوقتي: <a href="https://quran.com/" target="_blank">فتح المصحف على موقع خارجي</a></div></div>`+[['أذكار الصباح','sun'],['أذكار المساء','sunset'],['أذكار النوم','moon']].map(t=>`<div class="card"><h3>${I(t[1])} ${t[0]}</h3><div class="ph">صورة الأذكار والنص هيتحطوا من مصدر موثق، مش مكتوبين من الذاكرة.</div></div>`).join('')+`<div class="card"><h3>${I('bell')} وقت نومي</h3><input type="time" value="${g('sleep','22:30')}" onchange="st('sleep',this.value)"><p class="note">التذكير بأذكار النوم وسورة الملك محتاج اختبار على الموبايل، مش متأكد إنه بيوصل والتطبيق مقفول.</p></div>`};
H.day=()=>{shell('يومياتي','النهارده');return `<div class="card"><h3>مزاجي</h3><div class="mood">${MOODS(g('mood'+today(),-1))}</div></div>`+[['الصبح','sun'],['العصر','sunset'],['المغرب','moon']].map((t,i)=>`<div class="card"><h3>${I(t[1])} ${t[0]}</h3><div id="tk${i}">${(g('tasks'+i+today(),[])).map((x,j)=>`<div class="row"><label>${e(x.t)}</label><input type="checkbox" ${x.d?'checked':''} onchange="tk(${i},${j},this.checked)"></div>`).join('')}</div><input id="nt${i}" placeholder="مهمة جديدة"><button class="btn" onclick="at(${i})">إضافة</button></div>`).join('')+`<div class="card"><h3>${I('flower')} امتنان اليوم</h3><textarea rows=2 onchange="st('grat${today()}',this.value)">${e(g('grat'+today(),''))}</textarea></div><div class="card"><h3>جملة آخر اليوم (اختياري)</h3><input value="${e(g('end'+today(),''))}" onchange="st('end${today()}',this.value)"></div><p class="note">المهام مش بتترحّل لوحدها لليوم التاني.</p>`};
window.at=i=>{const v=$('#nt'+i).value.trim();if(!v)return;const k='tasks'+i+today(),a=g(k,[]);a.push({t:v,d:false});st(k,a);render()};
window.tk=(i,j,v)=>{const k='tasks'+i+today(),a=g(k,[]);a[j].d=v;st(k,a);const x=g('ach',{});x[today()]=x[today()]||{};x[today()].tasks=[0,1,2].reduce((s,n)=>s+g('tasks'+n+today(),[]).filter(t=>t.d).length,0);st('ach',x)};
H.edu=()=>{shell('تعليم');const cs=g('courses',[]);return `<div class="card"><h3>${I('edu')} كورساتي</h3>`+cs.map((c,i)=>`<div class="row"><label><b>${e(c.n)}</b><br><small>آخر درس: ${e(c.l)} | الخطوة الجاية: ${e(c.x)}</small></label></div>`).join('')+`<input id="cn" placeholder="اسم الكورس"><input id="cl" placeholder="آخر درس"><input id="cx" placeholder="الخطوة الجاية"><button class="btn" onclick="ac()">إضافة كورس</button></div><div class="card"><h3>عدّاد الأسبوع</h3>`+['تجويد','تفسير','فقه'].map(t=>`<div class="row"><label>${t}</label><button class="chip" onclick="wk('${t}',-1)">−</button><b>${g('wk'+t,0)}</b><button class="chip" onclick="wk('${t}',1)">+</button></div>`).join('')+`</div>`};
window.ac=()=>{const n=$('#cn').value.trim();if(!n)return;const a=g('courses',[]);a.push({n,l:$('#cl').value,x:$('#cx').value});st('courses',a);render()};window.wk=(t,d)=>{st('wk'+t,Math.max(0,g('wk'+t,0)+d));render()};
H.health=()=>{shell('عنايتي بنفسي','صحتك في مكان واحد');return `<button class="sec c1" style="width:100%;margin:6px 0" onclick="go('sport')">${I('sport')}رياضتي</button><button class="sec c2" style="width:100%;margin:6px 0" onclick="go('hawwa')">${I('drop')}دورتي الشهرية (حوّاء)</button><button class="sec c3" style="width:100%;margin:6px 0" onclick="go('body')">${I('scale')}جسمي ووزني</button><p class="note">كل حاجة هنا أمثلة للتجربة، مش نصايح طبية.</p>`};
H.sport=()=>{shell('رياضتي');return `<div class="card"><h3>فيديو ١٠ دقايق كل يوم</h3><div class="ph">قايمة فيديوهات مراجَعة (مشي في البيت، تمارين خفيفة للمبتدئات) هتتحط بعد ما نراجعها. الزرار هيفتح يوتيوب.</div><label>وقت التذكير</label><input type="time" value="${g('sptime','17:00')}" onchange="st('sptime',this.value)"></div>`+`<div class="card"><h3>عملت تمرين النهارده؟</h3>${checklist('sp',['خلصت ١٠ دقايق'])}</div>`};
window.MD=x=>{st((route()==='hawwa'?'hm':'mood')+today(),x);render()};
const SYM=['تعب','وجع','صداع','انتفاخ','تقلب مزاج','نوم زيادة'],METH=['حبوب','لولب','غرسة','حقن','وسيلة تانية','مفيش'];
window.pk=(kind)=>{const multi=kind==='sy',key=multi?'sy'+today():'meth',opts=multi?SYM:METH,cur=g(key,multi?[]:'');const ex=multi?g('syx'+today(),[]):[];
 const all=multi?[...opts,...ex]:opts;
 const rows=all.map((o,i)=>`<div class="row"><label for="pk${i}">${e(o)}</label><input type="${multi?'checkbox':'radio'}" name="pkg" id="pk${i}" value="${e(o)}" ${(multi?cur.includes(o):cur===o)?'checked':''}></div>`).join('');
 const extra=multi?`<div class="row"><input id="pkx" placeholder="إضافة حاجة تانية"></div>`:'';
 const d=document.createElement('div');d.className='ov';d.id='ov';d.innerHTML=`<div class="box"><h3>${multi?'اللي حاسة بيه':'وسيلة منع الحمل'}</h3>${rows}${extra}<button class="btn" id="pkok">تمام</button></div>`;document.body.appendChild(d);
 $('#pkok').onclick=()=>{const ch=[...d.querySelectorAll('input[name=pkg]:checked')].map(x=>x.value);if(multi){const x=($('#pkx').value||'').trim();let exs=ex;if(x){exs=[...ex,x];ch.push(x);st('syx'+today(),exs)}st(key,ch)}else st(key,ch[0]||'');d.remove();render()}};
H.hawwa=()=>{shell('حاسّة بإيه النهارده؟','حوّاء');const sy=g('sy'+today(),[]),me=g('meth','');return `<div class="card"><h3>مزاجي</h3><div class="mood">${MOODS(g('hm'+today(),-1))}</div></div><div class="card" style="background:#eaf3ea"><h3>اللي حاسة بيه</h3><button class="pick" onclick="pk('sy')"><span>${sy.length?e(sy.join('، ')):'اختاري'}</span>${I('chev')}</button></div><div class="card" style="background:#fff7dc"><h3>وسيلة منع الحمل (اختياري)</h3><button class="pick" onclick="pk('me')"><span>${me?e(me):'اختاري'}</span>${I('chev')}</button></div><div class="card"><h3>اكتبي اللي بتحسّي بيه</h3><textarea rows=4 placeholder="كتابة حرة" onchange="st('hn${today()}',this.value)">${e(g('hn'+today(),''))}</textarea></div><div class="card"><h3>إعدادات الدورة</h3><label>بتيجي كل كام يوم</label><input type="number" value="${g('cyc',28)}" onchange="st('cyc',+this.value)"><label>عدد أيام الدورة</label><input type="number" value="${g('plen',5)}" onchange="st('plen',+this.value)"><label>أول يوم في آخر دورة</label><input type="date" value="${g('last','')}" onchange="st('last',this.value);render()">${hcal()}</div><p class="note">ده خاص بيك إنتِ بس، ومش بيتشارك. الأيام المتوقعة تقديرية، مش تشخيص ولا وسيلة لمنع الحمل. بيانات حسّاسة، ومتخزّنة على جهازك بس في التجربة.</p>`};

function hcal(){const l=g('last','');if(!l)return '<p class="note">اختاري أول يوم لتظهر الأيام المتوقعة.</p>';const c=g('cyc',28),p=g('plen',5),s=new Date(l+'T00:00:00');let h='<div style="margin-top:8px">';for(let i=0;i<c;i++){const d=new Date(s);d.setDate(d.getDate()+i);const bg=i<p?'#f6a6c0':(i>=c-18&&i<=c-12)?'#bfe0f5':'#fff4f8';h+=`<span class="cell" style="background:${bg}">${d.getDate()}</span>`}return h+'</div><p class="note"><span style="background:#f6a6c0;padding:0 8px;border-radius:6px">&nbsp;</span> أيام الدورة المتوقعة &nbsp; <span style="background:#bfe0f5;padding:0 8px;border-radius:6px">&nbsp;</span> أيام الخصوبة المتوقعة (تقدير)</p>'}
H.body=()=>{shell('جسمي ووزني','سجّلي النهارده');return `<div class="card"><h3>هدفي</h3>${chips('gl',['أخس','أحافظ على جسمي','أزيد'],'goal',false)}</div><div class="card"><h3>وزني النهارده (كجم)</h3><input type="number" step="0.1" value="${g('w'+today(),'')}" onchange="st('w${today()}',this.value)"><h3>وزني المستهدف</h3><input type="number" step="0.1" value="${g('wt','')}" onchange="st('wt',this.value)"></div><div class="card"><h3>مقاساتي بالسنتيمتر</h3>`+['الوسط','الصدر','الورك','الذراع','الفخذ'].map(t=>`<label>${t}</label><input type="number" value="${g('ms'+t,'')}" onchange="st('ms${t}',this.value)">`).join('')+`</div><p class="note">الأرقام أمثلة، مش بنقول نصايح طبية.</p>`};
const BC=['#e8739f','#5c9b66','#8a6fc1','#d4a62a'],ST=['بقرا دلوقتي','خلصتها','عايزة أقرأها'];
function bks(){let b=g('books',null);if(!b){b=[{n:'كتاب تجريبي ١',a:'مؤلف تجريبي',tot:300,pg:120,s:0,q:[{t:'اقتباس تجريبي، مش من كتاب حقيقي.',p:'45'}],nt:[]},{n:'كتاب تجريبي ٢',a:'مؤلفة تجريبية',tot:200,pg:200,s:1,q:[],nt:[]}]}return b}
const cover=(c,i)=>`<i style="background:${c}"><svg viewBox="0 0 24 24" class="ic" style="stroke:#fff;fill:none;width:46px;height:46px"><path d="${P.tulip}"/></svg></i>`;
H.books=()=>{shell('كتبي','الكتب اللي بقراها');const b=bks(),f=g('bf',-1);return `<div class="pills"><button class="pill ${f===-1?'on':''}" onclick="st('bf',-1);render()">الكل</button>`+ST.map((t,i)=>`<button class="pill ${f===i?'on':''}" onclick="st('bf',${i});render()">${t}</button>`).join('')+`</div><div>`+b.map((x,i)=>f===-1||x.s===f?`<div class="bk" onclick="go('book${i}')">${cover(BC[i%4],i)}<b>${e(x.n)}</b><br><small>${x.q.length} اقتباسات، ${x.nt.length} تدوينة</small></div>`:'').join('')+`</div><div class="card"><h3>إضافة كتاب</h3><input id="bn" placeholder="اسم الكتاب"><input id="ba" placeholder="اسم المؤلف"><input id="bt" type="number" placeholder="عدد الصفحات"><button class="btn" onclick="ab()">إضافة كتاب</button></div><p class="note">الأسماء والأرقام أمثلة توضيحية للتجربة. كل كتاب واقتباساته بتكتبيهم إنتِ.</p>`};
window.ab=()=>{const n=$('#bn').value.trim();if(!n)return;const a=bks();a.push({n,a:$('#ba').value,tot:+$('#bt').value||0,pg:0,s:2,q:[],nt:[]});st('books',a);render()};
window.bst=(i,v)=>{const a=bks();a[i].s=v;st('books',a);render()};
window.bpg=(i,v)=>{const a=bks();a[i].pg=+v||0;st('books',a);render()};
function book(i){const a=bks(),b=a[i];if(!b)return H.books();shell(b.n,b.a||'المؤلف');const tab=g('bt'+i,0),pc=b.tot?Math.min(100,Math.round(b.pg/b.tot*100)):0;
 let h=`<div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="bk" style="width:90px;margin:0;box-shadow:none;padding:0">${cover(BC[i%4],i)}</div><div style="flex:1"><div class="pills">`+ST.map((t,k)=>`<button class="pill ${b.s===k?'on':''}" onclick="bst(${i},${k})">${t}</button>`).join('')+`</div><label>الصفحة اللي وصلتلها (من ${b.tot||'؟'})</label><input type="number" value="${b.pg}" onchange="bpg(${i},this.value)"><div class="bar"><i style="width:${pc}%"></i></div></div></div></div><div class="pills"><button class="pill ${tab===0?'on':''}" onclick="st('bt${i}',0);render()">اقتباساتي</button><button class="pill ${tab===1?'on':''}" onclick="st('bt${i}',1);render()">تدويناتي</button></div>`;
 if(tab===0){h+=b.q.map((q,j)=>`<div class="card q ${j%2?'g2':''}"><p>«${e(q.t)}»</p><small>صفحة ${e(q.p||'')}</small><button class="btn alt" onclick="go('share${i}_${j}')">شاركيه كصورة</button></div>`).join('')+`<div class="card"><textarea id="qt" rows=3 placeholder="اكتبي الاقتباس هنا"></textarea><input id="qp" placeholder="رقم الصفحة"><button class="btn" onclick="aq(${i})">إضافة اقتباس</button></div>`}
 else{h+=b.nt.map(t=>`<div class="card q"><p>${e(t)}</p></div>`).join('')+`<div class="card"><textarea id="nt" rows=3 placeholder="اكتبي تدوينتك"></textarea><button class="btn" onclick="an2(${i})">إضافة تدوينة</button></div>`}
 return h+`<p class="note">مثال توضيحي، مش اقتباسات حقيقية.</p>`}
window.aq=i=>{const t=$('#qt').value.trim();if(!t)return;const a=bks();a[i].q.push({t,p:$('#qp').value});st('books',a);render()};
window.an2=i=>{const t=$('#nt').value.trim();if(!t)return;const a=bks();a[i].nt.push(t);st('books',a);render()};
const CC=['#ece4f7','#dcebdc','#fde3ec','#fdf0c8'];
function share(i,j){const b=bks()[i];if(!b||!b.q[j])return H.books();shell('شاركي كصورة','اختاري الشكل');const ci=g('sc',3),wn=g('sn',0);
 return `<canvas id="cv" width="1080" height="1080" style="width:100%;border-radius:16px;box-shadow:0 4px 12px #0002"></canvas><div class="card"><h3>شكل البطاقة</h3><div style="display:flex;gap:12px">`+CC.map((c,k)=>`<button onclick="st('sc',${k});render()" style="width:44px;height:44px;border-radius:50%;background:${c};border:${ci===k?'4px solid #e8739f':'2px solid #ccc'}"></button>`).join('')+`</div><h3 style="margin-top:12px">مع ردّك على الاقتباس</h3><div class="pills"><button class="pill ${wn?'':'on'}" onclick="st('sn',0);render()">الاقتباس بس</button><button class="pill ${wn?'on':''}" onclick="st('sn',1);render()">مع تدويناتي</button></div><button class="btn" onclick="sv2()">احفظي كصورة</button><p class="note">تقدري تحفظيها أو تبعتيها لأي حد.</p></div>`+`<img src="" style="display:none" onerror="drw(${i},${j})">`}
window.drw=(i,j)=>{const b=bks()[i],q=b.q[j],c=$('#cv'),x=c.getContext('2d'),ci=g('sc',3);x.fillStyle=CC[ci];x.fillRect(0,0,1080,1080);x.strokeStyle='#e8739f';x.lineWidth=6;x.beginPath();x.roundRect(70,70,940,940,60);x.stroke();x.fillStyle='#fff8';x.fill();
 x.fillStyle='#2e5a3a';x.fillRect(536,70,8,70);x.fillStyle='#e8739f';x.beginPath();x.ellipse(540,60,22,34,0,0,7);x.fill();
 x.direction='rtl';x.textAlign='center';x.fillStyle='#2e5a3a';x.font='bold 56px "Noto Naskh Arabic","Noto Sans Arabic",system-ui';const w=q.t.split(' ');let L=[],cur='';w.forEach(a=>{if((cur+' '+a).length>22){L.push(cur);cur=a}else cur=cur?cur+' '+a:a});L.push(cur);L.slice(0,7).forEach((l,n)=>x.fillText(l,540,330+n*86));
 let y=330+Math.min(L.length,7)*86+20;if(g('sn',0)&&b.nt.length){x.font='38px system-ui';x.fillStyle='#6b3f51';x.fillText(b.nt[0].slice(0,40),540,y);}
 x.font='bold 42px system-ui';x.fillStyle='#4a2f3b';x.fillText(b.n,540,870);x.font='32px system-ui';x.fillStyle='#6b3f51';x.fillText((b.a||'')+(q.p?'، صفحة '+q.p:''),540,925);x.font='34px Georgia';x.fillText('Mariam studio',540,985)};
window.sv2=()=>{$('#cv').toBlob(async bl=>{const f=new File([bl],'sakan-quote.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='sakan-quote.png';a.click()}})};

H.cal=()=>{shell('التقويم','مواعيدي وتذكيراتي');const a=g('apps',[]).sort((x,y)=>(x.d+x.t).localeCompare(y.d+y.t));return `<div class="card"><h3>القادم</h3>`+(a.map(x=>`<div class="row"><label>${I('bell')} ${e(x.n)}<br><small>${x.d} ${x.t}</small></label></div>`).join('')||'<p class="note">مفيش مواعيد.</p>')+`</div><div class="card"><input id="an" placeholder="الموعد"><input id="ad" type="date"><input id="at" type="time"><button class="btn" onclick="aa()">إضافة</button><p class="note">تنبيه الموبايل والتطبيق مقفول لسه ما اتجربش.</p></div>`};
window.aa=()=>{const n=$('#an').value.trim(),d=$('#ad').value,t=$('#at').value;if(!n||!d)return;const a=g('apps',[]);a.push({n,d,t:t||'00:00'});st('apps',a);render()};
H.help=()=>{shell('مساعد سَكَن','بيساعدك تلاقي حاجتك، مش ذكاء اصطناعي');return `<div class="g"><button class="sec c3" onclick="go('cal')">${I('cal')}مواعيدي النهارده</button><button class="sec c1" onclick="go('day')">${I('check')}مهامي</button><button class="sec c2" onclick="go('books')">${I('books')}اقتباساتي</button><button class="sec c4" onclick="go('month')">${I('star')}إنجازاتي</button></div><div class="card"><input id="sq" placeholder="دوري في كتاباتي أنا بس"><button class="btn" onclick="ss()">بحث</button><div id="sr"></div></div>`};
window.ss=()=>{const q=$('#sq').value.trim();if(!q)return;const hits=[];Object.keys(D).forEach(k=>{const s=JSON.stringify(D[k]);if(!/^(sakan|ach)/.test(k)&&s.includes(q))hits.push(k+': '+s.slice(0,80))});$('#sr').innerHTML=hits.length?hits.map(h=>`<p class="note">${e(h)}</p>`).join(''):'<p class="note">مفيش نتيجة.</p>'};
const KH=['كل خطوة صغيرة بتعدّي، والأثر بيفضل.','النية الطيبة نص الطريق.','اللي بيبدأ ببسم الله بيلاقي البركة.'];
H.month=()=>{shell('إنجازات الشهر','أشطر كتكوت');const a=g('ach',{});const m=today().slice(0,7);let pr=0,tk=0,days=0;Object.keys(a).filter(k=>k.startsWith(m)).forEach(k=>{days++;pr+=a[k].pr||0;tk+=a[k].tasks||0});return `<div class="card"><div id="cel">${CHICK}</div><h3 style="text-align:center">أشطر كتكوت!</h3><div class="row"><label>أيام سجّلتي فيها</label><b>${days}</b></div><div class="row"><label>صلوات اتعلّمت</label><b>${pr}</b></div><div class="row"><label>مهام خلصتيها</label><b>${tk}</b></div><p style="text-align:center">«${KH[new Date().getMonth()%3]}»</p></div><p class="note">الأرقام من بيانات التجربة، والخاطرة بتتغير كل شهر.</p>`};
H.me=()=>{shell('حسابي');const inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone;return `<div class="card"><h3>حالة التثبيت</h3><p>${inst?I('check')+' مفتوح من أيقونة الشاشة الرئيسية':'لسه في المتصفح'}</p></div><div class="card"><h3>الشكل</h3>${chips('th',['بينك','أخضر'],'theme',false)}</div><div class="card"><h3>بياناتي</h3><button class="btn red" onclick="if(confirm('مسح كل بيانات التجربة من الجهاز؟')){localStorage.removeItem('${K}');D={};render()}">مسح بياناتي</button><p class="note">تسجيل الدخول بالإيميل والمسح من السيرفر لسه ما اتوصلوش بالشكل ده، اتجرّبوا في صفحة منفصلة.</p></div>`};
function route(){const h=(location.hash||'#home').slice(1);return h}
window.go=r=>{location.hash=r};
function render(){const r=route();$('#tul').outerHTML=TULIP.replace('class="tu"','class="tu" id="tul"');const sm=r.match(/^share(\d+)_(\d+)$/);$('#m').innerHTML=sm?share(+sm[1],+sm[2]):/^book\d+$/.test(r)?book(+r.slice(4)):(H[r]||H.home)();$('#m').insertAdjacentHTML('beforeend','<div class="brand">Mariam studio</div>');
 $('#tb').innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="${r===t[0]?'on':''}">${I(t[2])}${t[1]}</a>`).join('');
 if(g('theme')==='أخضر'){document.documentElement.style.setProperty('--pk','#bfdcbf');document.body.style.background='#f1f8f1'}else{document.documentElement.style.setProperty('--pk','#f8b8cf');document.body.style.background='#fdf1f5'}
 [['sy','sy'+today(),true],['me2','meth',false],['gl','goal',false],['th','theme',false]].forEach(a=>{if($('#'+a[0]))bindChips(a[0],a[1],a[2])});window.scrollTo(0,0)}
addEventListener('hashchange',render);
if(location.search.includes('demo')&&!D.books){D.courses=[{n:'كورس وهمي',l:'الدرس ٣',x:'الدرس ٤'}];sv()}
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
